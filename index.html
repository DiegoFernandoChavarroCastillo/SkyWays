<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard General - Skyways Airlines</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <h1>Skyways</h1>
                        <p>Airlines</p>
                    </div>
                </div>

                <nav class="nav-menu">
                    <a href="index.html" class="nav-item active">
                        <span class="nav-icon">📊</span>
                        <span>Dashboard</span>
                    </a>
                    <a href="listaVuelos.html" class="nav-item">
                        <span class="nav-icon">✈️</span>
                        <span>Programación de vuelos</span>
                    </a>
                    <a href="nuevoVuelo.html" class="nav-item">
                        <span class="nav-icon">➕</span>
                        <span>Crear Vuelo</span>
                    </a>
                    <a href="gestionAeronaves.html" class="nav-item">
                        <span class="nav-icon">🛩️</span>
                        <span>Gestión de aeronaves</span>
                    </a>
                    <a href="tripulacion.html" class="nav-item">
                        <span class="nav-icon">👥</span>
                        <span>Tripulación</span>
                    </a>
                    <a href="reportes.html" class="nav-item">
                        <span class="nav-icon">📈</span>
                        <span>Reportes</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <button class="nav-item" id="themeToggle">
                    <span class="nav-icon" id="themeIcon">🌙</span>
                    <span id="themeText">Modo Oscuro</span>
                </button>
                <a href="https://wa.link/crq4a2" class="nav-item">
                    <span class="nav-icon">💬</span>
                    <span>Soporte</span>
                </a>
                
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navigation -->
            <header class="top-nav">
                <div class="nav-left">
                    <h2>Dashboard General</h2>
                    <span class="current-time" id="currentTime"></span>
                </div>
                <div class="nav-right">
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Buscar vuelos...">
                    </div>
                    <button class="notification-btn" id="notificationBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="user-avatar"></div>

                    <!-- Notification Panel -->
                    <div class="notification-panel" id="notificationPanel">
                        <div class="notification-header">
                            <h3>Notificaciones</h3>
                            <button class="mark-all-read" id="markAllRead">Marcar todas como leídas</button>
                        </div>
                        <div class="notification-list" id="notificationList"></div>
                    </div>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="stats-grid" id="statsGrid">
                <!-- Stats cards will be generated by JavaScript -->
            </div>

            <!-- Flights Table -->
            <section class="flights-section">
                <div class="section-header">
                    <h3>Próximos Vuelos</h3>
                    <span class="flight-count" id="flightCount"></span>
                </div>
                <div class="table-container">
                    <table class="flights-table">
                        <thead>
                            <tr>
                                <th>Vuelo</th>
                                <th>Ruta</th>
                                <th>Hora de Salida</th>
                                <th>Aeronave</th>
                                <th>Ocupación</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="flightsTableBody">
                            <!-- Rows will be generated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
